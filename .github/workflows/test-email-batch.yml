name: Send test email batch

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Send both test emails
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USERNAME: ${{ secrets.MUHAMMAD_ILYAS }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: >-
          python send_batch_emails.py
          --workbook test_emails.xlsx
          --start-date 2026-11-15
          --batch-size 50
          --days 1
          --send
